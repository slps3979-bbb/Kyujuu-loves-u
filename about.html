<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>福岡美食相對位置地圖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #a8000b;
            --soft-pink-bg: rgba(255, 235, 238, 0.88);
            --text-dark: #3e2723;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
            background-image: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), url('cherry.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-dark);
        }

        .container {
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* 頂部導覽列（返回 index.html） */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .btn-back {
            background: #ffffff;
            color: var(--primary-red);
            border: 2.5px solid var(--primary-red);
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s ease;
        }
        .btn-back:active { transform: scale(0.92); }

        .page-title {
            font-size: 17px;
            font-weight: 900;
            color: var(--primary-red);
            margin: 0;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        /* 區域切換按鈕組 */
        .region-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .tab-btn {
            font-family: inherit;
            background: #ffffff;
            color: var(--primary-red);
            border: 2.5px solid var(--primary-red);
            border-radius: 16px;
            padding: 9px 4px;
            font-size: 13.5px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            outline: none;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #a8000b, #d32f2f);
            color: #ffffff;
            border-color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(168, 0, 11, 0.35);
        }

        /* 主內容卡片 */
        .main-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid #ffffff;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            min-height: 0;
            box-sizing: border-box;
        }

        .card-header-title {
            font-size: 13.5px;
            font-weight: 900;
            color: #4e342e;
            margin-bottom: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 地圖圖片容器 */
        .map-wrapper {
            width: 100%;
            height: 38vh;
            max-height: 260px;
            background: #fff8f8;
            border-radius: 14px;
            border: 2px solid #ffcdd2;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .map-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.25s ease;
        }

        /* 店舖 Google Maps 連結清單區塊 */
        .shop-list-section {
            flex: 1;
            margin-top: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding-bottom: 60px;
        }

        .shop-link-btn {
            background: #ffffff;
            color: var(--text-dark);
            border: 1.5px solid #ffcdd2;
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        .shop-link-btn:active {
            background: var(--soft-pink-bg);
            border-color: var(--primary-red);
            transform: scale(0.96);
        }

        .shop-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .map-icon {
            font-size: 13px;
            flex-shrink: 0;
        }

        ::-webkit-scrollbar { width: 4px; }
